<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Cozy To-Do List 🌿</title>

    <!-- Cute font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Connect to CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Main app card -->
    <div class="widget">
      <!-- Top section: date card + progress card -->
      <div class="top-row">
        <!-- Date card -->
        <div class="date-card">
          <!-- Left arrow: go to previous day -->
          <button class="date-arrow left" id="prev-day-btn" title="Previous day">
            ‹
          </button>

          <!-- These values will be filled by JavaScript -->
          <p class="day-name" id="day-name">Monday</p>
          <p class="day-number" id="day-number">13</p>
          <p class="month-name" id="month-name">February</p>

          <!-- Right arrow: go to next day -->
          <button class="date-arrow right" id="next-day-btn" title="Next day">
            ›
          </button>
        </div>

        <!-- Progress card -->
        <div class="progress-card">
          <p class="progress-label">Progress</p>

          <!-- Progress bar background -->
          <div class="progress-bar-bg">
            <!-- This inner bar grows/shrinks in JS -->
            <div class="progress-bar-fill" id="progress-bar"></div>
          </div>

          <!-- Progress text like 1 / 3 tasks done -->
          <p class="progress-text" id="progress-text">0 / 0 tasks done</p>
        </div>
      </div>

      <!-- Input row: add a task -->
      <div class="input-section">
        <input
          type="text"
          id="task-input"
          placeholder="Write your task here..."
        />
        <button id="add-btn">Add Task</button>
      </div>

      <!-- Search row -->
      <div class="search-section">
        <input
          type="text"
          id="search-input"
          placeholder="🔍 Search tasks..."
        />
      </div>

      <!-- Category filter pills will appear here -->
      <div class="category-row">
        <div class="category-filters" id="category-filters"></div>
      </div>

      <!-- Row for adding a new category + selecting category for a new task -->
      <div class="new-category-row" id="new-category-row">
        <button id="show-category-input-btn" class="soft-btn">
          + Add Category
        </button>

        <select id="task-category-select">
          <option value="">No category</option>
        </select>
      </div>

      <!-- Hidden row that appears when user wants to create a category -->
      <div class="category-input-area" id="category-input-area">
        <input
          type="text"
          id="category-name-input"
          placeholder="Category name..."
        />
        <button id="save-category-btn" class="soft-btn">Save</button>
        <button id="cancel-category-btn" class="soft-btn cancel-btn">
          Cancel
        </button>
      </div>

      <!-- Task list section -->
      <div class="task-list-section">
        <p class="tasks-title">My Tasks</p>

        <!-- Message shown when there are no visible tasks -->
        <div class="empty-state" id="empty-state">
          <p>🌸 No tasks yet! Add something above.</p>
        </div>

        <!-- JavaScript will insert tasks here -->
        <ul id="task-list"></ul>
      </div>
    </div>

    <!-- Connect to JS -->
    <script src="script.js"></script>
  </body>
</html>
